{% extends "base.html" %}
{% block content %}
{% for message in messages_for_render %}
<div class="card">
    <h2>Message #{{ message.number }}</h2>
    <p>{{ message.text | highlight_guestbook }}</p>
    <small>Created at {{ message.created_at }}</small>
</div>
{% endfor %}
<p class="nav-link"><a href="{{ url_for('guestbook.add_form') }}" class="btn">Add message</a></p>
{% endblock %}
