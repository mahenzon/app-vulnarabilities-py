{% extends "base.html" %}
{% block content %}
{% for message in messages_for_render %}
<div>
    <h2>Message #{{ message.number }}</h2>
    <p>{{ message.text | safe }}</p>
    <small>Created at {{ message.created_at }}</small>
</div>
{% endfor %}
<p><a href="{{ url_for('guestbook.add_form') }}">Add message</a></p>
{% endblock %}
