{% extends "base.html" %}
{% block content %}
<form method="post" action="{{ url_for('guestbook.add_message') }}">
    <label for="message">Message</label>
    <textarea name="message" id="message" required placeholder="Write something..."></textarea>
    <div class="form-actions">
        <button type="submit" class="btn">Submit</button>
        <a href="{{ url_for('guestbook.index') }}">Back to guestbook</a>
    </div>
</form>
{% endblock %}
